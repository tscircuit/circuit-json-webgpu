name: Check renderer
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck && bun run test && bun run build
      - run: bunx playwright install --with-deps chromium
      - run: xvfb-run -a env WEBGPU_SOFTWARE=1 bun run test:visual
      - run: xvfb-run -a env WEBGPU_SOFTWARE=1 bun run test:snapshots
      - run: bun run test:parity-layout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-results
          path: tests/actual/
