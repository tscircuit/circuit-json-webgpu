name: SVG / WebGPU parity audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'main' }}
          path: .parity-base
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Install base audit dependencies
        working-directory: .parity-base
        run: |
          bun install
          svg_reference_version=$(bun -p 'require("../node_modules/circuit-to-svg/package.json").version')
          svg_schema_version=$(bun -p 'require("../node_modules/circuit-json/package.json").version')
          bun add --dev --no-save "circuit-to-svg@$svg_reference_version" "circuit-json@$svg_schema_version"
      - run: bunx playwright install --with-deps chromium
      # Normalize only the SVG reference rasterization; the base renderer stays unchanged.
      - name: Use the same SVG font fallback in both audits
        run: |
          bun -e '
            const path = ".parity-base/tests/parity/run.ts"
            const source = await Bun.file(path).text()
            await Bun.write(path, source.replace("new Resvg(svg)", `new Resvg(svg, { font: { defaultFontFamily: "DejaVu Sans" } })`))
          '
      # The strict audit has known failures on main. Run both revisions on the
      # same runner; the required comparison below rejects every new regression.
      - name: Audit base revision
        run: xvfb-run -a env WEBGPU_SOFTWARE=1 bun run test:parity
        working-directory: .parity-base
        continue-on-error: true
      - name: Audit proposed revision
        run: xvfb-run -a env WEBGPU_SOFTWARE=1 bun run test:parity
        continue-on-error: true
      - name: Reject parity regressions
        run: bun tests/parity/check-regressions.ts .parity-base/tests/actual/parity/report.json tests/actual/parity/report.json
      - run: bun run test:parity-layout
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-webgpu-parity
          path: tests/actual/parity/
