name: SVG / WebGPU parity audit
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'main' }}
          path: .parity-base
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun install
        working-directory: .parity-base
      - run: bunx playwright install --with-deps chromium
      # Capture once. Both renderer revisions use the same fixtures, SVG
      # reference, camera, and audit code, including when the reference is updated.
      - name: Audit proposed revision
        run: xvfb-run -a env WEBGPU_SOFTWARE=1 bun run test:parity
        continue-on-error: true
      - name: Audit base renderer against the same reference
        run: xvfb-run -a env WEBGPU_SOFTWARE=1 PARITY_RENDERER_ROOT=.parity-base PARITY_OUTPUT_DIR=tests/actual/parity-base bun tests/parity/run.ts
        continue-on-error: true
      - name: Reject parity regressions
        run: bun tests/parity/check-regressions.ts tests/actual/parity-base/report.json tests/actual/parity/report.json
      - run: bun run test:parity-layout
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svg-webgpu-parity
          path: |
            tests/actual/parity/
            tests/actual/parity-base/
